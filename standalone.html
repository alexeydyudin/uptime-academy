  {t:'quiz',h:'Коллега после rebase делает `git push --force` в общую ветку develop. Чем это опасно?',o:['Перезапишет историю на сервере и сотрёт чужие коммиты','Ничем, это обычная практика','Удалит репозиторий','Отключит CI'],a:0,ex:'Если очень нужно, есть `--force-with-lease`: он откажется, если на сервере появились чужие коммиты. В общие ветки лучше не форсить вообще.'},
 ]},
 l24:{title:'Пишем Dockerfile',xp:30,setup:dockerfileWorld,steps:[
  {t:'lecture',pages:[
   {h:'Образ собирается слоями',p:'Каждая инструкция Dockerfile — слой. Docker кеширует слои: если инструкция и её файлы не менялись, слой берётся из кеша. Как только слой изменился, все следующие собираются заново.',code:'FROM node:22-alpine      # базовый образ\nWORKDIR /app\nCOPY package*.json ./    # сначала только зависимости\nRUN npm ci               # кешируется, пока не менялся package.json\nCOPY . .                 # потом код: меняется часто\nRUN npm run build'},
   {h:'Multi-stage: собрать в одном, запустить в другом',p:'Компиляторы и dev-зависимости нужны только для сборки. В финальный образ копируют лишь результат — он становится в разы меньше, быстрее качается и содержит меньше уязвимостей.',code:'FROM node:22-alpine AS build\n...\nRUN npm run build\n\nFROM node:22-alpine\nWORKDIR /app\nCOPY --from=build /app/dist ./dist\nCOPY --from=build /app/node_modules ./node_modules\nUSER node\nCMD ["node", "dist/server.js"]'},
   {h:'Правила хорошего образа',terms:[['Фиксируй тег','node:22-alpine, а не latest: сборка повторяема'],['Не root','USER node: если приложение взломают, у атакующего меньше прав'],['CMD в exec-форме','["node", "server.js"]: процесс получает сигнал остановки'],['.dockerignore','не тащить в образ node_modules, .git и секреты'],['npm ci','ставит ровно то, что в package-lock.json']]}]},
  {t:'task',h:'Собери как есть',p:'Ты в папке проекта shop. Собери образ из текущего Dockerfile с тегом shop:1.0 и посмотри его размер.',hints:['docker build с флагом тега и контекстом сборки (точка). Список образов — docker images.','docker build -t <имя:тег> . && docker images','docker build -t shop:1.0 . && docker images'],sol:['docker build -t shop:1.0 . && docker images'],
   done:'1.12 ГБ ради небольшого API: внутри компиляторы, исходники и все dev-зависимости.',check:W=>W.f.built&&W.f.built['shop:1.0']&&W.f.images},
  {t:'quiz',h:'Ты поменял одну строку в src, а сборка снова долго ставит зависимости. Почему?',o:['COPY . . стоит до npm install, и любая правка кода сбрасывает кеш','Docker не умеет кешировать','npm всегда качает заново','Нужно чистить кеш вручную'],a:0,ex:'Слой COPY . . меняется при любой правке, а все слои после него пересобираются. Копируй package*.json и ставь зависимости до копирования кода.'},
  {t:'edit',h:'Перепиши Dockerfile',p:'Сделай образ правильным: зафиксированный тег вместо latest, multi-stage сборка, зависимости через npm ci до копирования кода, финальный запуск не от root, CMD в exec-форме.',file:'Dockerfile',path:'/home/dev/shop/Dockerfile',hint:'Возьми за основу вторую карточку лекции и добавь сверху стадию build: COPY package*.json ./, RUN npm ci, COPY . ., RUN npm run build.',
   checks:[{name:'Тег зафиксирован (не latest)',test:t=>{const f=[...t.matchAll(/^\s*FROM\s+(\S+)/gim)].map(m=>m[1]);return f.length>0&&f.every(x=>/:/.test(x)&&!/:latest$/.test(x))}},
    {name:'Multi-stage: стадия AS build и COPY --from',test:t=>/^\s*FROM\s+\S+\s+AS\s+\w+/im.test(t)&&(t.match(/^\s*FROM\s/gim)||[]).length>=2&&/COPY\s+--from=/i.test(t)},
    {name:'package*.json и npm ci до COPY . .',test:t=>{const L=t.split('\n'),iP=L.findIndex(l=>/COPY\s+package/.test(l)),iC=L.findIndex(l=>/RUN\s+npm\s+ci\b/.test(l)),iA=L.findIndex(l=>/^\s*COPY\s+\.\s+\./.test(l));return iP>=0&&iC>iP&&(iA<0||iA>iC)}},
    {name:'Финальная стадия не от root (USER)',test:t=>/^\s*USER\s+(?!root\b)\S+/im.test(t.split(/^\s*FROM\s/im).pop())},
    {name:'CMD в exec-форме ["…"]',test:t=>/^\s*CMD\s+\[\s*"/m.test(t)}],
   sample:'FROM node:22-alpine AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\nFROM node:22-alpine\nWORKDIR /app\nCOPY --from=build /app/dist ./dist\nCOPY --from=build /app/node_modules ./node_modules\nUSER node\nCMD ["node", "dist/server.js"]\n',done:'Dockerfile сохранён. Пересоберём и сравним.'},
  {t:'task',h:'Сравни',p:'Собери новый образ shop:1.1 и сравни размеры.',hints:['Та же команда сборки, другой тег.','docker build -t shop:1.1 . && docker images','docker build -t shop:1.1 . && docker images'],sol:['docker build -t shop:1.1 . && docker images'],
   done:'168 МБ вместо 1.12 ГБ — почти в 7 раз меньше. Деплой быстрее, уязвимостей меньше.',check:W=>W.f.built&&W.f.built['shop:1.1']&&W.f.built['shop:1.1'].froms.length>1},
  {t:'quiz',h:'Зачем нужен .dockerignore?',o:['Не отправлять в сборку node_modules, .git и секреты','Чтобы Docker игнорировал ошибки','Чтобы не скачивать базовый образ','Это замена Dockerfile'],a:0,ex:'Без него COPY . . унесёт в образ всё подряд, включая .env с паролями.'},
 ]},
 l25:{title:'Docker Compose',xp:25,setup:composeWorld,steps:[
  {t:'lecture',pages:[
   {h:'Весь стек одним файлом',p:'Приложению нужны база, кеш, воркер — запускать каждый контейнер руками неудобно. Docker Compose описывает весь стек в одном YAML и поднимает его одной командой.',code:'services:\n  api:\n    image: shop:1.1\n    environment:\n      DATABASE_URL: postgres://shop:secret@db:5432/shop\n    depends_on: [db]\n  db:\n    image: postgres:16\n    environment:\n      POSTGRES_PASSWORD: secret\n    volumes:\n      - db-data:/var/lib/postgresql/data\nvolumes:\n  db-data:'},
   {h:'Сеть и данные',p:'Compose создаёт общую сеть, и сервисы находят друг друга по имени: api подключается к хосту db. У каждого контейнера свой localhost, поэтому localhost:5432 из api — это сам api, а не база. Данные базы держат в volume: контейнер можно пересоздать, данные останутся.',code:'docker compose up -d     # поднять в фоне\ndocker compose ps        # статус\ndocker compose logs api  # логи сервиса\ndocker compose down      # остановить и удалить контейнеры'}]},
  {t:'edit',h:'Добавь базу',p:'Опиши в compose.yaml сервис db на postgres:16 с паролем и volume для данных. api подключи к нему по имени сервиса и сделай зависимым от db.',file:'compose.yaml',path:'/home/dev/shop/compose.yaml',hint:'Ориентируйся на первую карточку лекции. Не забудь объявить volume в конце файла: `volumes:` и под ним `  db-data:`.',checks:COMPOSE_CHECKS,
   sample:'services:\n  api:\n    image: shop:1.1\n    ports:\n      - "8080:8080"\n    environment:\n      DATABASE_URL: postgres://shop:secret@db:5432/shop\n    depends_on:\n      - db\n  db:\n    image: postgres:16\n    environment:\n      POSTGRES_USER: shop\n      POSTGRES_PASSWORD: secret\n      POSTGRES_DB: shop\n    volumes:\n      - db-data:/var/lib/postgresql/data\n\nvolumes:\n  db-data:\n',done:'Стек описан. Поднимаем.'},
  {t:'task',h:'Подними стек',p:'Запусти стек в фоне и убедись, что оба сервиса работают.',hints:['docker compose: подкоманда запуска с флагом фона, потом статус.','docker compose up -d && docker compose ps','docker compose up -d && docker compose ps'],sol:['docker compose up -d && docker compose ps'],
   done:'api и db работают. `docker compose logs api` покажет подключение к базе.',check:W=>W.f.composeUp&&W.compose&&W.compose.ok&&W.f.composePs},
  {t:'quiz',h:'Почему api не может подключиться к базе по localhost:5432?',o:['У каждого контейнера свой localhost; к базе обращаются по имени сервиса db','Postgres не слушает 5432','Compose запрещает localhost','Нужно открыть порт 5432 наружу'],a:0,ex:'В сети compose имя сервиса работает как DNS-имя. Публиковать порт базы наружу для этого не нужно и даже вредно.'},
  {t:'quiz',h:'Что будет с данными базы после `docker compose down`, если volume не описан?',o:['Пропадут вместе с контейнером','Сохранятся в образе postgres','Сохранятся в /tmp','Compose спросит, сохранить ли их'],a:0,ex:'Без volume данные живут в слое контейнера и удаляются вместе с ним. Volume переживает down и up, удалить его можно только явно: `down -v`.'},
 ]},
 l26:{title:'Terraform',xp:30,setup:tfWorld,steps:[
  {t:'lecture',pages:[
   {h:'Инфраструктура как код',p:'Вместо кликов в консоли облака серверы, сети и бакеты описывают в файлах. Код лежит в git, проходит ревью, и ту же инфраструктуру можно поднять повторно.',code:'resource "aws_instance" "web" {\n  ami           = "ami-0a1b2c3d4e5f67890"\n  instance_type = "t3.micro"\n  tags = { Name = "shop-web" }\n}'},
   {h:'init → plan → apply',p:'`terraform init` скачивает провайдеры. `terraform plan` сравнивает код с реальностью и показывает, что изменится. `terraform apply` применяет план после подтверждения. Читай plan перед каждым apply — это главная защита.',code:'+    create    будет создан\n~    update    изменится на месте\n-    destroy   будет удалён\n-/+  replace   удалится и создастся заново (осторожно!)'},
   {h:'State и дрейф',p:'Terraform помнит, что он создал, в файле состояния (state). Если ресурс поменяли руками в консоли, код и реальность расходятся — это дрейф. Следующий plan предложит вернуть всё «как в коде».',terms:[['state','что Terraform создал и как оно выглядит'],['remote state','state в общем хранилище с блокировкой, а не на ноутбуке'],['drift','реальность изменили в обход кода'],['провайдер','плагин для облака: aws, yandex, google']]}]},
  {t:'task',h:'Инициализация',p:'Ты в папке infra с кодом инфраструктуры магазина. Подготовь её к работе.',hints:['Первая команда в любой папке Terraform.','terraform init','terraform init'],sol:['terraform init'],
   done:'Провайдер AWS скачан и записан в .terraform.lock.hcl. Этот файл коммитят, чтобы у всех была одна версия.',check:W=>W.tf.inited},
  {t:'task',h:'Что изменится?',p:'Посмотри, что Terraform собирается сделать с инфраструктурой.',hints:['Показать изменения без применения.','terraform plan','terraform plan'],sol:['terraform plan'],
   done:'Создать бакет — ожидаемо. Но почему он хочет поменять instance_type сервера, если в код этого никто не трогал?',check:W=>W.f.tfPlan>=1},
  {t:'quiz',h:'Откуда изменение t3.large → t3.micro?',o:['Кто-то поменял тип сервера руками в консоли — это дрейф','Terraform сам решил сэкономить','Ошибка провайдера','Так выглядит каждый plan'],a:0,ex:'В коде t3.micro, а в облаке t3.large. Apply «как есть» молча уменьшит сервер в разгар нагрузки.'},
  {t:'edit',h:'Зафиксируй решение в коде',p:'Выяснилось: сервер увеличили осознанно, из-за нагрузки. Зафиксируй t3.large в коде, чтобы Terraform его не откатывал.',file:'main.tf',path:'/home/dev/infra/main.tf',hint:'В блоке aws_instance.web: `instance_type = "t3.large"`.',
   checks:[{name:'instance_type = "t3.large"',test:t=>/instance_type\s*=\s*"t3\.large"/.test(t)},{name:'Бакет assets остался в коде',test:t=>/resource\s+"aws_s3_bucket"\s+"assets"/.test(t)}],
   sample:'provider "aws" {\n  region = "eu-central-1"\n}\n\nresource "aws_instance" "web" {\n  ami           = "ami-0a1b2c3d4e5f67890"\n  instance_type = "t3.large"\n  tags = { Name = "shop-web" }\n}\n\nresource "aws_s3_bucket" "assets" {\n  bucket = "uptime-shop-assets"\n}\n',done:'Код снова совпадает с реальностью. Правильный порядок на будущее: сначала правка в коде, потом apply — не наоборот.'},
  {t:'task',h:'Примени',p:'Убедись, что план теперь только создаёт бакет, и примени его.',hints:['Сначала plan, потом apply. Terraform попросит подтверждение — введи yes.','terraform plan, затем terraform apply и yes','terraform plan && terraform apply, затем yes'],sol:['terraform plan && terraform apply','yes'],
   done:'1 added, 0 changed: бакет создан, сервер не тронут.',check:W=>W.tf.state.bucket&&W.tf.state.web==='t3.large'},
  {t:'quiz',h:'Почему terraform.tfstate не хранят в git?',o:['В нём бывают секреты, а параллельные apply затрут друг друга','Он слишком большой','git не умеет JSON','Terraform запрещает'],a:0,ex:'State хранят удалённо (S3, Object Storage, Terraform Cloud) с блокировкой, чтобы двое не запустили apply одновременно.'},
 ]},
 l27:{title:'Ansible',xp:25,setup:ansWorld,steps:[
  {t:'lecture',pages:[
   {h:'Terraform создаёт, Ansible настраивает',p:'Ansible заходит на серверы по SSH и приводит их к описанному состоянию: пакеты, конфиги, сервисы, пользователи. Ставить агентов на серверы не нужно.',code:'inventory.ini        site.yml (playbook)\n[web]                - hosts: web\nweb-1                  become: true\nweb-2                  tasks:\n                         - apt: name=nginx state=present\n                         - service: name=nginx state=started'},
   {h:'Описываешь состояние, а не шаги',p:'Задача «nginx: state: present» значит «пакет должен быть установлен», а не «выполни apt install». Если пакет уже стоит, Ansible ничего не делает. Это идемпотентность: плейбук можно запускать сколько угодно раз.',terms:[['inventory','список серверов и групп'],['playbook','сценарий: какие задачи на каких хостах'],['module','готовое действие: apt, service, copy, template'],['--check','пробный прогон без изменений'],['become','выполнять задачи от root через sudo']]}]},
  {t:'task',h:'Проверь связь',p:'Ты в папке ansible. Убедись, что Ansible достаёт до всех серверов группы web.',hints:['Есть модуль ping, его запускают командой ansible (без -playbook).','ansible <группа> -i <инвентарь> -m ping','ansible web -i inventory.ini -m ping'],sol:['ansible web -i inventory.ini -m ping'],
   done:'pong от обоих: SSH работает, Python на серверах есть.',check:W=>W.f.ansPing},
  {t:'edit',h:'Напиши плейбук',p:'Сделай плейбук для группы web: с правами root поставить пакет nginx и запустить сервис nginx с автозапуском.',file:'site.yml',path:'/home/dev/ansible/site.yml',hint:'Две задачи: ansible.builtin.apt (name: nginx, state: present) и ansible.builtin.service (name: nginx, state: started, enabled: true). И не забудь hosts: web и become: true.',
   checks:[{name:'Плейбук для группы web',test:t=>/hosts:\s*web\s*$/m.test(t)},{name:'Права root (become: true)',test:t=>/become:\s*(true|yes)\b/.test(t)},{name:'Пакет nginx ставится (apt, state: present)',test:t=>/\bapt:/.test(t)&&/name:\s*nginx/.test(t)&&/state:\s*present/.test(t)},{name:'nginx запущен и в автозапуске (service)',test:t=>/\b(service|systemd):/.test(t)&&/state:\s*started/.test(t)&&/enabled:\s*(true|yes)/.test(t)}],
   sample:'- name: Веб-серверы\n  hosts: web\n  become: true\n  tasks:\n    - name: Установить nginx\n      ansible.builtin.apt:\n        name: nginx\n        state: present\n        update_cache: true\n\n    - name: Запустить nginx и включить автозапуск\n      ansible.builtin.service:\n        name: nginx\n        state: started\n        enabled: true\n',done:'Плейбук готов. На проде сначала смотрят пробный прогон.'},
  {t:'task',h:'Пробный прогон',p:'Запусти плейбук в режиме проверки: Ansible покажет, что изменил бы, но ничего не тронет.',hints:['ansible-playbook с инвентарём и флагом проверки.','ansible-playbook -i <инвентарь> <плейбук> --check','ansible-playbook -i inventory.ini site.yml --check'],sol:['ansible-playbook -i inventory.ini site.yml --check'],
   done:'changed=2 на каждом сервере: nginx будет установлен и запущен.',check:W=>W.f.ansCheck},
  {t:'task',h:'Примени дважды',p:'Примени плейбук, потом запусти его ещё раз и сравни PLAY RECAP.',hints:['Тот же запуск без --check, два раза подряд.','ansible-playbook -i inventory.ini site.yml','ansible-playbook -i inventory.ini site.yml, затем то же самое ещё раз'],sol:['ansible-playbook -i inventory.ini site.yml','ansible-playbook -i inventory.ini site.yml'],
   done:'Первый раз changed=2, второй — changed=0. Это и есть идемпотентность: повторный запуск безопасен.',check:W=>W.f.ansIdem},
  {t:'quiz',h:'Когда Terraform, а когда Ansible?',o:['Terraform создаёт облачные ресурсы, Ansible настраивает то, что внутри серверов','Это одно и то же','Ansible только для Windows','Terraform только для Kubernetes'],a:0,ex:'Типичная связка: Terraform поднимает VM и сеть, Ansible ставит на них софт. В мире Kubernetes эту роль часто забирают образы и Helm.'},
 ]},
 l28:{title:'Service и Ingress',xp:25,setup:svcK8sWorld,steps:[
  {t:'lecture',pages:[
   {h:'Поды смертны, Service постоянен',p:'У каждого пода свой IP, и он меняется при пересоздании. Service даёт постоянное имя и адрес и балансирует трафик между подами. Каких именно — решает selector: Service берёт все поды с подходящими метками.',code:'Ingress shop.local/ ──► Service web:80 ──► поды с меткой app=web, порт 8080\n                         selector: app=web    10.42.1.7\n                                              10.42.2.4\n                                              10.42.3.9'},
   {h:'Как это проверить',code:'kubectl get svc                  # сервисы\nkubectl describe svc web         # селектор и порты\nkubectl get endpoints web        # IP подов, куда идёт трафик\nkubectl get pods --show-labels   # метки подов',terms:[['Service','постоянный адрес и балансировка для группы подов'],['selector','какие метки должны быть у подов'],['Endpoints','реальные IP подов за сервисом'],['Ingress','вход снаружи по домену и пути']]}]},
  {t:'task',h:'Куда уходит трафик?',p:'После переименования сайт отдаёт 503, хотя все поды web в Running. Проверь, на какие поды Service web отправляет трафик.',hints:['Реальные адреса за сервисом называются endpoints.','kubectl get endpoints <сервис>','kubectl get endpoints web'],sol:['kubectl get endpoints web'],
   done:'<none>: у сервиса нет ни одного пода. Ingress шлёт трафик в пустоту, отсюда 503.',check:W=>W.f.ep>=1},
  {t:'task',h:'Сравни метки',p:'Выясни, почему сервис не видит поды: сравни его селектор с метками подов.',hints:['Селектор виден в describe, метки — у get pods со специальным флагом.','kubectl describe svc web и kubectl get pods --show-labels','kubectl describe svc web && kubectl get pods --show-labels'],sol:['kubectl describe svc web && kubectl get pods --show-labels'],
   done:'Сервис ищет app=shop-web, а у подов метка app=web.',check:W=>W.f.svcDesc&&W.f.showLabels},
  {t:'quiz',h:'Почему endpoints пустые?',o:['Селектор сервиса не совпадает с метками подов','Поды не готовы','Сломан Ingress','Не хватает реплик'],a:0,ex:'Service не знает поды по именам — только по меткам. Одна опечатка в selector, и трафик идёт в никуда.'},
  {t:'edit',h:'Почини Service',p:'Поправь селектор в service.yaml, чтобы он совпадал с метками подов.',file:'service.yaml',path:'/home/dev/k8s/service.yaml',hint:'`app: shop-web` → `app: web`',
   checks:[{name:'selector app: web',test:t=>/selector:\s*\n\s+app:\s*web\s*$/m.test(t)},{name:'Порты на месте (80 → 8080)',test:t=>/port:\s*80\b/.test(t)&&/targetPort:\s*8080/.test(t)}],
   sample:'apiVersion: v1\nkind: Service\nmetadata:\n  name: web\nspec:\n  selector:\n    app: web\n  ports:\n    - port: 80\n      targetPort: 8080\n',done:'Манифест исправлен. Осталось применить его к кластеру.'},
  {t:'task',h:'Примени и проверь',p:'Примени манифест и убедись, что у сервиса появились endpoints.',hints:['Манифесты применяют командой apply с флагом файла.','kubectl apply -f <файл>, затем снова endpoints','kubectl apply -f service.yaml && kubectl get endpoints web'],sol:['kubectl apply -f service.yaml && kubectl get endpoints web'],
   done:'Три IP подов за сервисом — 503 ушли.',check:W=>W.f.epOk},
  {t:'quiz',h:'Чем Ingress отличается от Service типа LoadBalancer?',o:['Ingress — один вход для многих сервисов с маршрутизацией по домену и пути','Ничем','LoadBalancer работает только внутри кластера','Ingress нужен только для баз данных'],a:0,ex:'LoadBalancer создаёт отдельный облачный балансировщик на каждый сервис, а это дорого. Ingress-контроллер — один вход и правила для всех.'},
 ]},
 l29:{title:'Конфиги, секреты, пробы',xp:30,setup:cfgK8sWorld,steps:[
  {t:'lecture',pages:[
   {h:'Конфиг отдельно от образа',p:'Один образ едет в dev, stage и prod — меняются только настройки. Обычные настройки кладут в ConfigMap, пароли и токены — в Secret, и подставляют в под через переменные окружения. Secret хранится в base64 — это кодирование, а не шифрование.',code:'env:\n  - name: DB_PASSWORD\n    valueFrom:\n      secretKeyRef:\n        name: db          # имя Secret\n        key: password     # ключ внутри него\n\nkubectl create secret generic db --from-literal=password=...'},
   {h:'Пробы: готов ли под и жив ли он',p:'readinessProbe отвечает на вопрос «можно ли слать трафик»: пока проверка не прошла, пода нет в endpoints сервиса. livenessProbe — «жив ли процесс»: если проверка падает, kubelet перезапускает контейнер.',code:'readinessProbe:\n  httpGet: { path: /healthz, port: 8080 }\nlivenessProbe:\n  httpGet: { path: /healthz, port: 8080 }\n  initialDelaySeconds: 15'},
   {h:'Ресурсы',p:'requests — сколько ресурсов гарантировать поду, по ним планировщик выбирает ноду. limits — потолок: превысил лимит памяти — контейнер убит с OOMKilled. Без них один под может съесть всю ноду.',terms:[['requests','гарантированный минимум, по нему размещают поды'],['limits','максимум, выше которого нельзя'],['OOMKilled','контейнер убит за превышение лимита памяти'],['ConfigMap','несекретные настройки']]}]},
  {t:'quiz',h:'Secret в Kubernetes хранится в base64. Это значит...',o:['Это кодирование: прочитать может любой, у кого есть доступ к Secret','Пароль надёжно зашифрован','Пароль хешируется','Его никто не может прочитать'],a:0,ex:'`echo UzNjcjN0 | base64 -d` — и пароль на экране. Поэтому доступ к Secret ограничивают через RBAC, а для чувствительного используют Vault и шифрование etcd.'},
  {t:'edit',h:'Приведи деплоймент в порядок',p:'В deployment.yaml пароль лежит открытым текстом, нет проб и лимитов. Возьми пароль из Secret db (ключ password), добавь readinessProbe и livenessProbe на /healthz и задай requests и limits.',file:'deployment.yaml',path:'/home/dev/k8s/deployment.yaml',hint:'Все три блока есть в лекции. Они идут внутри контейнера, на одном уровне с image и env.',checks:DEPLOY_CHECKS,
   sample:'apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: shop\nspec:\n  replicas: 2\n  selector:\n    matchLabels:\n      app: shop\n  template:\n    metadata:\n      labels:\n        app: shop\n    spec:\n      containers:\n        - name: shop\n          image: shop:2.4\n          ports:\n            - containerPort: 8080\n          env:\n            - name: DB_PASSWORD\n              valueFrom:\n                secretKeyRef:\n                  name: db\n                  key: password\n          readinessProbe:\n            httpGet:\n              path: /healthz\n              port: 8080\n            periodSeconds: 5\n          livenessProbe:\n            httpGet:\n              path: /healthz\n              port: 8080\n            initialDelaySeconds: 15\n          resources:\n            requests:\n              cpu: 100m\n              memory: 128Mi\n            limits:\n              memory: 256Mi\n',done:'Манифест стал готов к проду. Выкатим его.'},
  {t:'task',h:'Создай Secret и выкати',p:'Создай Secret db с паролем, примени манифест и дождись окончания выкатки.',hints:['Secret создают командой kubectl create secret generic с флагом --from-literal.','kubectl create secret generic db --from-literal=password=<пароль>, затем kubectl apply -f deployment.yaml и kubectl rollout status deployment/shop','kubectl create secret generic db --from-literal=password=S3cr3t-prod-pass && kubectl apply -f deployment.yaml && kubectl rollout status deployment/shop'],sol:['kubectl create secret generic db --from-literal=password=S3cr3t-prod-pass && kubectl apply -f deployment.yaml && kubectl rollout status deployment/shop','kubectl rollout status deployment/shop'],
   done:'successfully rolled out. Если применить манифест раньше, чем создан Secret, поды повиснут в CreateContainerConfigError — запомни этот статус.',check:W=>W.f.deployApplied&&W.k8s.secrets.db&&W.k8s.pods.some(p=>p.app==='shop')&&W.k8s.pods.filter(p=>p.app==='shop'&&p.status!=='Terminating').every(p=>p.status==='Running')},
  {t:'quiz',h:'livenessProbe ходит на /healthz, который проверяет базу. База легла на минуту. Что будет?',o:['Kubernetes начнёт перезапускать все поды приложения, хотя они живы','Ничего','Поды перестанут получать трафик, и всё','Kubernetes перезапустит базу'],a:0,ex:'Liveness должна проверять только сам процесс. Зависимости — дело readiness: под временно уберут из балансировки, но перезапускать не будут.'},
 ]},
 l30:{title:'Helm',xp:25,setup:helmWorld,steps:[
  {t:'lecture',pages:[
   {h:'Пакетный менеджер Kubernetes',p:'Приложение в Kubernetes — это десяток манифестов. Helm упаковывает их в chart с шаблонами и параметрами (values). Установленный chart называется release, и у каждого обновления есть номер ревизии.',code:'helm repo add shop https://charts.shop.local\nhelm install shop shop/shop                    # релиз shop из чарта shop/shop\nhelm upgrade shop shop/shop --set image.tag=2.5\nhelm history shop                              # ревизии\nhelm rollback shop 1                           # откат на ревизию 1'},
   {h:'values: один чарт, разные окружения',p:'Всё, что отличается между окружениями, выносят в values: тег образа, число реплик, домен. Для прода — свой values-prod.yaml в git, а не длинная строка --set в истории терминала.',terms:[['chart','пакет шаблонов манифестов'],['values','параметры для шаблонов'],['release','установленный экземпляр чарта'],['revision','версия релиза после install, upgrade или rollback']]}]},
  {t:'task',h:'Подключи репозиторий',p:'Чарты компании лежат по адресу https://charts.shop.local. Добавь этот репозиторий под именем shop.',hints:['helm repo с подкомандой добавления.','helm repo add <имя> <url>','helm repo add shop https://charts.shop.local'],sol:['helm repo add shop https://charts.shop.local'],
   done:'Репозиторий подключён. `helm search repo shop` покажет, какие в нём чарты.',check:W=>W.f.helmRepo},
  {t:'task',h:'Установи',p:'Установи релиз с именем shop из чарта shop/shop.',hints:['helm install: сначала имя релиза, потом чарт.','helm install <релиз> <репо/чарт>','helm install shop shop/shop'],sol:['helm install shop shop/shop'],
   done:'REVISION 1, STATUS deployed. В кластере появились деплоймент и поды shop.',check:W=>W.helm.rel.shop&&W.helm.rel.shop.hist.length>=1},
  {t:'task',h:'Обнови до 2.5',p:'Выкати новую версию приложения: тег образа 2.5.',hints:['helm upgrade с параметром --set.','helm upgrade <релиз> <чарт> --set image.tag=<тег>','helm upgrade shop shop/shop --set image.tag=2.5'],sol:['helm upgrade shop shop/shop --set image.tag=2.5'],
   done:'REVISION 2. Проверь, как себя чувствуют поды.',check:W=>W.f.helm_upgrade==='2.5'},
  {t:'task',h:'Откатись',p:'Поды новой версии падают. Найди номер последней рабочей ревизии и откатись на неё.',hints:['Сначала посмотри поды и историю релиза.','kubectl get pods, helm history shop, затем helm rollback shop <ревизия>','helm history shop && helm rollback shop 1'],sol:['kubectl get pods','kubectl get pods','helm history shop && helm rollback shop 1'],
   done:'Откат — тоже новая ревизия (3), история не теряется. Поды снова на 2.4.',check:W=>W.f.helmRollback==='2.4'},
  {t:'quiz',h:'Где правильно хранить настройки для прода?',o:['В values-prod.yaml в git','В длинной строке --set в истории терминала','Прямо в шаблонах чарта','В заметках дежурного'],a:0,ex:'Файл в git проходит ревью и воспроизводим. Выкатка через CI или GitOps (Argo CD) берёт его оттуда.'},
 ]},
 l31:{title:'SLO и error budget',xp:25,steps:[
  {t:'lecture',pages:[
   {h:'SLI, SLO, SLA',p:'SLI — что измеряем, например долю успешных быстрых запросов. SLO — цель команды: 99.9% за 30 дней. SLA — обещание клиенту с последствиями в договоре, обычно мягче SLO.',code:'SLI = хорошие запросы / все запросы\n    = (без 5xx и быстрее 300 мс) / все\n\nSLO: SLI ≥ 99.9% за скользящие 30 дней'},
   {h:'Error budget',p:'Если цель 99.9%, то 0.1% — бюджет на ошибки. Пока бюджет есть, можно выкатывать фичи и рисковать. Кончился — команда переключается на надёжность.',code:'SLO       простой за 30 дней\n99%       7 ч 12 мин\n99.5%     3 ч 36 мин\n99.9%     43 мин\n99.95%    21 мин\n99.99%    4 мин 19 с'},
   {h:'Burn rate',p:'Burn rate — во сколько раз быстрее нормы тратится бюджет. 1 — бюджет закончится ровно к концу окна. 14.4 — месячный бюджет сгорит за двое суток: повод будить дежурного.',terms:[['SLI','измеряемый показатель качества'],['SLO','целевое значение SLI'],['SLA','договорное обязательство'],['error budget','допустимая доля ошибок'],['burn rate','скорость расхода бюджета']]}]},
  {t:'quiz',h:'SLO 99.9% за 30 дней. Сколько полного простоя он допускает?',o:['Около 43 минут','Около 4 минут','Около 7 часов','Около 9 часов'],a:0,ex:'30 × 24 × 60 = 43 200 минут, 0.1% от них — 43.2 минуты.'},
  {t:'quiz',h:'За месяц было 10 миллионов запросов, SLO 99.9%. Сколько из них могут завершиться ошибкой?',o:['10 000','1 000','100 000','100'],a:0,ex:'0.1% от 10 000 000 = 10 000. Бюджет удобно считать в запросах: так он не зависит от трафика.'},
  {t:'quiz',h:'К 10-му числу error budget на месяц израсходован. Что по практике SRE?',o:['Заморозить рискованные релизы и заняться надёжностью','Поднять SLO, чтобы мотивировать команду','Отключить алерты до конца месяца','Ничего, бюджет — формальность'],a:0,ex:'Бюджет — договорённость между продуктом и эксплуатацией: пока он исчерпан, приоритет у стабильности.'},
  {t:'quiz',h:'Какой SLI лучше для API оформления заказа?',o:['Доля запросов без 5xx и быстрее 500 мс','Загрузка CPU сервера','Число подов','Свободное место на диске'],a:0,ex:'SLI должен отражать опыт пользователя. CPU и диск — возможные причины, а не симптомы.'},
  {t:'edit',h:'Опиши SLO',p:'Сформулируй SLO для checkout API: цель от 99.5 до 99.95, окно 30 дней, SLI — отношение хороших запросов (без 5xx) ко всем.',file:'slo.yaml',
   starter:'service: checkout-api\nslo:\n  objective:    # цель в процентах\n  window:       # окно\n  sli:\n    good:       # PromQL: хорошие запросы\n    total:      # PromQL: все запросы\n',
   hint:'objective: 99.9\nwindow: 30d\ngood: sum(rate(http_requests_total{job="checkout",status!~"5.."}[5m]))\ntotal: sum(rate(http_requests_total{job="checkout"}[5m]))',
   checks:[{name:'Цель от 99.5 до 99.95',test:t=>{const m=t.match(/objective:\s*([\d.]+)/);return !!m&&+m[1]>=99.5&&+m[1]<=99.95}},{name:'Окно 30 дней',test:t=>/window:\s*["']?(30d|28d|4w)\b/.test(t)},{name:'good — запросы без 5xx',test:t=>/good:\s*\S.*http_requests_total[^\n]*status\s*!~\s*["']5/.test(t)},{name:'total — все запросы',test:t=>/total:\s*\S.*http_requests_total/.test(t)}],
   sample:'service: checkout-api\nslo:\n  objective: 99.9\n  window: 30d\n  sli:\n    good: sum(rate(http_requests_total{job="checkout",status!~"5.."}[5m]))\n    total: sum(rate(http_requests_total{job="checkout"}[5m]))\n',done:'Такое описание принимают инструменты вроде Sloth и Pyrra: они сами сгенерируют правила и алерты по burn rate.'},
  {t:'quiz',h:'Почему SLO не ставят 100%?',o:['Это недостижимо и останавливает любые изменения','100% стоит слишком дёшево','Prometheus не умеет 100%','Так требует закон'],a:0,ex:'Сети, железо и зависимости иногда отказывают. 100% означает «ничего нельзя менять», а пользователь всё равно не отличит 99.99% от 100%.'},
 ]},
 l32:{title:'Сканирование образов',xp:30,setup:trivyWorld,steps:[
  {t:'lecture',pages:[
   {h:'Уязвимости приходят с базовым образом',p:'Твой код — малая часть образа. Остальное — ОС, библиотеки и рантайм из базового образа, и в них регулярно находят уязвимости (CVE). Сканер сравнивает версии пакетов в образе с базами уязвимостей.',code:'trivy image shop:1.2\ntrivy image --severity CRITICAL,HIGH shop:1.2\ntrivy image --exit-code 1 --severity CRITICAL shop:1.2   # для CI'},
   {h:'Что с этим делать',p:'1. Обновить базовый образ — обычно закрывает большинство находок.\n2. Брать минимальные образы (alpine, slim, distroless): меньше пакетов — меньше уязвимостей.\n3. Сканировать в CI и ронять сборку на критичных находках.\n4. Регулярно пересобирать образы, даже если код не менялся.',terms:[['CVE','публичный идентификатор уязвимости'],['severity','критичность: CRITICAL, HIGH, MEDIUM, LOW'],['EOL','версия больше не поддерживается, патчей не будет'],['SBOM','список всех компонентов образа']]}]},
  {t:'task',h:'Просканируй',p:'Перед релизом проверь образ shop:1.2 сканером уязвимостей.',hints:['Сканер — trivy, режим сканирования образов.','trivy image <образ>','trivy image shop:1.2'],sol:['trivy image shop:1.2'],
   done:'1 CRITICAL и 3 HIGH. А Node 16 уже вне поддержки: исправлений для него не будет.',check:W=>W.f.trivy&&W.f.trivy['shop:1.2']},
  {t:'quiz',h:'Откуда большинство найденных уязвимостей?',o:['Из базового образа: системные библиотеки и рантайм','Из нашего кода','Из Dockerfile','Из Kubernetes'],a:0,ex:'zlib, glibc, openssl, сам node — всё пришло из node:16. Поэтому первый шаг — свежий базовый образ.'},
  {t:'edit',h:'Обнови базовый образ',p:'Переведи обе стадии на поддерживаемую версию Node (20 или новее) в минимальном варианте: alpine или slim.',file:'Dockerfile',path:'/home/dev/shop/Dockerfile',hint:'`FROM node:16 AS build` → `FROM node:22-alpine AS build`, и так же во второй стадии.',
   checks:[{name:'Нет node:16 и latest',test:t=>!/node:(1\d|[0-9])\b|:latest\b/.test(t)},{name:'Node 20+ во всех стадиях',test:t=>{const f=[...t.matchAll(/^\s*FROM\s+(\S+)/gim)].map(m=>m[1]);return f.length>=2&&f.every(x=>/node:(2\d|[3-9]\d)/.test(x))}},{name:'Финальная стадия минимальная (alpine, slim, distroless)',test:t=>{const f=[...t.matchAll(/^\s*FROM\s+(\S+)/gim)].map(m=>m[1]);return /alpine|slim|distroless/.test(f[f.length-1]||'')}}],
   sample:'FROM node:22-alpine AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\nFROM node:22-alpine\nWORKDIR /app\nCOPY --from=build /app/dist ./dist\nCOPY --from=build /app/node_modules ./node_modules\nUSER node\nCMD ["node", "dist/server.js"]\n',done:'Пересоберём и проверим.'},
  {t:'task',h:'Пересобери и перепроверь',p:'Собери shop:1.3 и просканируй его.',hints:['Сборка, затем тот же trivy.','docker build -t <тег> . && trivy image <тег>','docker build -t shop:1.3 . && trivy image shop:1.3'],sol:['docker build -t shop:1.3 . && trivy image shop:1.3'],
   done:'Ни одной CRITICAL и HIGH. Осталась одна LOW — такие принимают как риск или ждут патча.',check:W=>W.f.trivy&&W.f.trivy['shop:1.3']&&W.f.trivy['shop:1.3'].crit===0&&W.f.trivy['shop:1.3'].high===0},
  {t:'edit',h:'Поставь шлагбаум в CI',p:'Добавь в ci.yml шаг, который сканирует собранный образ и роняет сборку при находках CRITICAL и HIGH.',file:'.github/workflows/ci.yml',path:'/home/dev/shop/.github/workflows/ci.yml',hint:'Вместо строки TODO: `      - run: trivy image --exit-code 1 --severity CRITICAL,HIGH shop:${{ github.sha }}`',
   checks:[{name:'Есть шаг с trivy',test:t=>/trivy\s+image/.test(t)||/aquasecurity\/trivy-action/.test(t)},{name:'Сборка падает на находках (exit-code 1)',test:t=>/--exit-code\s+1|exit-code:\s*["']?1/.test(t)},{name:'Фильтр по CRITICAL и HIGH',test:t=>/CRITICAL/.test(t)&&/HIGH/.test(t)},{name:'Сканирование до push',test:t=>t.indexOf('trivy')>-1&&t.indexOf('trivy')<t.indexOf('docker push')}],
   sample:'name: ci\non: [push]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: docker build -t shop:${{ github.sha }} .\n      - run: trivy image --exit-code 1 --severity CRITICAL,HIGH shop:${{ github.sha }}\n      - run: docker push registry.local/shop:${{ github.sha }}\n',done:'Образ с критичной уязвимостью больше не доедет до прода сам.'},
  {t:'quiz',h:'Нашлась CRITICAL-уязвимость, но исправленной версии пакета пока нет. Что разумно?',o:['Оценить риск, задокументировать исключение и следить за патчем','Отключить сканер','Выкатить и забыть','Вырезать пакет руками из образа'],a:0,ex:'Для этого у trivy есть .trivyignore и флаг --ignore-unfixed. Главное — исключение осознанное и с датой пересмотра.'},
 ]},
 l33:{title:'Утёкшие секреты',xp:25,setup:leakWorld,steps:[
  {t:'lecture',pages:[
   {h:'Секрет в git — это навсегда',p:'Удалить файл новым коммитом мало: секрет остаётся в истории, в форках и у всех, кто склонировал репозиторий. Боты сканируют GitHub и находят ключи облаков за минуты после push.',code:'git log -p | grep AKIA     # история помнит всё\n\nПравильный порядок:\n1. Отозвать (ротировать) ключ — сразу\n2. Убрать секрет из кода, читать из окружения\n3. Не дать повториться: сканер в pre-commit и CI'},
   {h:'Где хранить секреты',p:'Локально — в .env, который добавлен в .gitignore. В CI — в секретах пайплайна. В Kubernetes — в Secret, а лучше во внешнем хранилище: Vault, Yandex Lockbox, AWS Secrets Manager. В коде — только чтение из переменных окружения.',terms:[['ротация','выпустить новый ключ и отозвать старый'],['gitleaks','сканер секретов в файлах и истории git'],['pre-commit hook','проверка перед каждым коммитом на машине разработчика'],['push protection','GitHub блокирует push с известными форматами ключей']]}]},
  {t:'task',h:'Просканируй репозиторий',p:'Аудитор попросил проверить репозиторий shop на утёкшие секреты, включая всю историю коммитов.',hints:['gitleaks в режиме проверки git-истории.','gitleaks detect (или gitleaks git)','gitleaks detect'],sol:['gitleaks detect'],
   done:'Ключ AWS в config/aws.js, коммит недельной давности. Его уже могли найти.',check:W=>W.f.leakScan},
  {t:'quiz',h:'Первое действие после такой находки?',o:['Отозвать ключ в AWS и выпустить новый','Удалить файл и закоммитить','Сделать репозиторий приватным','Переписать историю git'],a:0,ex:'Пока ключ действует, всё остальное вторично. Ротация закрывает доступ, даже если ключ уже скопировали.'},
  {t:'edit',h:'Убери ключ из кода',p:'Пусть config/aws.js берёт ключи из переменных окружения AWS_ACCESS_KEY_ID и AWS_SECRET_ACCESS_KEY.',file:'config/aws.js',path:'/home/dev/shop/config/aws.js',hint:'`const AWS_KEY = process.env.AWS_ACCESS_KEY_ID;` и `const AWS_SECRET = process.env.AWS_SECRET_ACCESS_KEY;`',
   checks:[{name:'В коде нет ключей',test:t=>!/AKIA[0-9A-Z]{16}/.test(t)&&!/wJalrXUtnFEMI/.test(t)},{name:'Ключи из process.env',test:t=>/process\.env\.AWS_ACCESS_KEY_ID/.test(t)&&/process\.env\.AWS_SECRET_ACCESS_KEY/.test(t)}],
   sample:'// Доступ к S3 для загрузки картинок\nconst AWS_REGION = "eu-central-1";\nconst AWS_KEY = process.env.AWS_ACCESS_KEY_ID;\nconst AWS_SECRET = process.env.AWS_SECRET_ACCESS_KEY;\n\nmodule.exports = { AWS_REGION, AWS_KEY, AWS_SECRET };\n',done:'Код чистый.'},
  {t:'edit',h:'Закрой .env от git',p:'Разработчики хранят ключи локально в файле .env. Сделай так, чтобы он никогда не попал в репозиторий.',file:'.gitignore',path:'/home/dev/shop/.gitignore',hint:'Добавь строку `.env`',
   checks:[{name:'.env в .gitignore',test:t=>/^\s*\.env\*?\s*$/m.test(t)},{name:'Старые правила на месте',test:t=>/node_modules/.test(t)}],sample:'node_modules/\ndist/\n.env\n',done:'Теперь `git add .` не захватит .env.'},
  {t:'task',h:'Проверь текущие файлы',p:'Убедись, что в текущих файлах проекта секретов не осталось.',hints:['У gitleaks есть режим сканирования папки без истории.','gitleaks dir <путь>','gitleaks dir .'],sol:['gitleaks dir .'],
   done:'Файлы чистые. Но `gitleaks detect` по-прежнему найдёт ключ в старом коммите — поэтому ротация была обязательной.',check:W=>W.f.leakDir},
  {t:'quiz',h:'Как не допустить повторения?',o:['gitleaks в pre-commit и в CI, секреты — в хранилище','Ревью раз в квартал','Запретить разработчикам облако','Шифровать весь репозиторий'],a:0,ex:'pre-commit ловит ошибку до коммита, CI — если хук обошли. А GitHub Push Protection блокирует известные форматы ключей прямо при push.'},
 ]},
 l34:{title:'Постмортем',xp:30,steps:[
  {t:'lecture',pages:[
   {h:'Разбор без поиска виноватых',p:'После инцидента пишут разбор: что случилось, почему и что изменим. Главный принцип — blameless: ищем слабые места в системе и процессах, а не виноватого. Если человек ошибся, значит, система позволила ошибиться.',code:'## Что произошло\n## Влияние          кто пострадал, сколько, как долго\n## Хронология       время → событие\n## Корневая причина\n## Что сделаем      задачи с владельцем и сроком'},
   {h:'5 почему',p:'Спрашивай «почему», пока не дойдёшь до системной причины.\nСайт лёг → nginx упал → диск заполнен → 38 ГБ старых логов → ротацию не настроили при запуске сервера → в чек-листе запуска нет пункта про logrotate.\nПоследний ответ и есть то, что надо чинить.',terms:[['blameless','разбор без обвинений'],['MTTR','среднее время восстановления'],['action item','конкретная задача с владельцем и сроком']]}]},
  {t:'quiz',h:'Инцидент случился после команды инженера Пети. Что пишем в постмортеме?',o:['Какая защита позволила команде пройти без проверки и как её добавить','Что Петя ошибся и его надо наказать','Ничего, раз виноватый найден','Что инцидент — случайность'],a:0,ex:'Обвинения учат людей скрывать ошибки. Разбор системы учит её становиться надёжнее.'},
  {t:'edit',h:'Напиши постмортем',p:'Опиши инцидент из урока «nginx лёг в 3 ночи»: в 03:12 сработал алерт, в 03:20 нашли заполненный диск, в 03:24 удалили старый лог на 38 ГБ, в 03:25 nginx поднят. Сайт не работал 13 минут. Заполни все разделы, а вместо «…» напиши свой текст.',file:'postmortem.md',
   starter:'# Постмортем: недоступность сайта 21.10\n\n## Что произошло\n…\n\n## Влияние\n…\n\n## Хронология\n- 03:12 …\n\n## Корневая причина\n…\n\n## Что сделаем\n- [ ] …\n',
   hint:'Влияние: «сайт недоступен 13 минут ночью». Хронология — четыре события из условия. Корневая причина: не настроена ротация логов и нет алерта на заполнение диска. Задачи: настроить logrotate, добавить алерт на диск > 85%, с владельцем и сроком.',
   checks:[{name:'Все разделы на месте',test:t=>['Что произошло','Влияние','Хронология','Корневая причина','Что сделаем'].every(h=>new RegExp('^##\\s*'+h,'mi').test(t))},
    {name:'Влияние в цифрах (минуты)',test:t=>/\d+\s*мин/i.test(mdSec(t,'Влияние'))},
    {name:'Хронология: минимум 3 события со временем',test:t=>(mdSec(t,'Хронология').match(/\b\d{1,2}:\d{2}\b/g)||[]).length>=3},
    {name:'Корневая причина системная (ротация логов, мониторинг диска)',test:t=>/ротац|logrotate|алерт|мониторинг/i.test(mdSec(t,'Корневая причина'))},
    {name:'Минимум две задачи «- [ ]»',test:t=>(mdSec(t,'Что сделаем').match(/^\s*-\s*\[\s?\]\s*\S/gm)||[]).length>=2},
    {name:'Заглушек «…» не осталось',test:t=>!/…|\.\.\./.test(t)}],
   sample:'# Постмортем: недоступность сайта 21.10\n\n## Что произошло\nnginx на prod-web-01 упал из-за заполненного диска.\n\n## Влияние\nСайт был недоступен 13 минут ночью, все пользователи видели ошибку.\n\n## Хронология\n- 03:12 сработал алерт: сайт недоступен\n- 03:20 нашли заполненный на 100% диск\n- 03:24 удалили старый лог на 38 ГБ\n- 03:25 nginx поднят, сайт работает\n\n## Корневая причина\nНе настроена ротация логов, и нет алерта на заполнение диска.\n\n## Что сделаем\n- [ ] Настроить logrotate на всех веб-серверах — Алексей, до 30.10\n- [ ] Алерт на диск > 85% — Олег, до 28.10\n',
   done:'Такой документ читают всей командой, а задачи из него попадают в бэклог с владельцами.'},
  {t:'quiz',h:'Какая задача из постмортема хорошая?',o:['Настроить logrotate на всех веб-серверах — Алексей, до 30.10','Быть внимательнее с дисками','Чаще проверять серверы','Не допускать таких инцидентов'],a:0,ex:'Хорошая задача конкретна, проверяема и имеет владельца со сроком. «Быть внимательнее» нельзя ни сделать, ни проверить.'},
  {t:'quiz',h:'Что такое MTTR?',o:['Среднее время восстановления после сбоя','Время между релизами','Максимальный трафик','Время ответа сервера'],a:0,ex:'MTTR входит в DORA-метрики вместе с частотой деплоев, временем доставки изменений и долей неудачных изменений.'},
 ]},

/* лекции к первым урокам: заменяют короткие вводные карточки */
const LECTURES={
 l1:[{h:'Терминал — главный инструмент девопса',p:'Серверы в облаке почти никогда не имеют графического интерфейса. Ты подключаешься по SSH и управляешь ими командами: вводишь текст — получаешь текст.',code:'dev@prod-web-01:~$ pwd\n/home/dev\n│   │           │\n│   │           └ текущая папка (~ — домашняя)\n│   └ имя сервера\n└ пользователь'},
     {h:'Файловая система',p:'Всё в Linux — файлы в одном дереве от корня /. Пути, которые начинаются с /, абсолютные. Остальные считаются от текущей папки.',code:'/            корень\n├── etc/     конфиги: nginx, systemd, hosts\n├── home/    домашние папки пользователей\n├── var/log/ логи\n└── tmp/     временные файлы',terms:[['pwd','где я'],['ls','что здесь (ls -la — подробно и со скрытыми)'],['cd','перейти (cd .. — на уровень выше, cd ~ — домой)'],['cat','показать файл']]}],
 l2:[{h:'Логи — первое место при инциденте',p:'Приложения пишут в лог всё важное: запросы, предупреждения, ошибки. Логи большие, поэтому их не читают целиком, а фильтруют.',code:'tail -n 50 app.log     # последние 50 строк\ntail -f app.log        # следить в реальном времени\ngrep ERROR app.log     # только строки с ERROR\ngrep -c ERROR app.log  # сколько их\ngrep -i error app.log  # без учёта регистра'},
     {h:'Трубы: соединяем команды',p:'Вертикальная черта | передаёт вывод одной команды на вход другой. Так из простых утилит собирают анализ на лету.',code:'cat app.log | grep ERROR | wc -l\n# прочитать → оставить ошибки → посчитать строки',terms:[['|','труба: вывод слева → вход справа'],['wc -l','посчитать строки'],['уровни логов','DEBUG < INFO < WARN < ERROR < FATAL']]}],
 l3:[{h:'Процессы',p:'Каждая запущенная программа — процесс с уникальным номером PID. ps показывает список процессов, top и htop — нагрузку в реальном времени.',code:'ps aux\nUSER   PID  %CPU %MEM COMMAND\nroot     1   0.0  0.4 /sbin/init\nwww    902   1.2  0.9 nginx: worker process'},
     {h:'Сигналы',p:'Процессу можно послать сигнал. SIGTERM (`kill PID`) — вежливая просьба завершиться: процесс успевает сохранить данные. SIGKILL (`kill -9 PID`) — ядро убивает процесс сразу, без шанса прибраться.',terms:[['SIGTERM (15)','попросить завершиться, сигнал по умолчанию'],['SIGKILL (9)','убить немедленно, перехватить нельзя'],['SIGHUP (1)','многие демоны по нему перечитывают конфиг']]}],
 l4:[{h:'Как дежурный разбирает инцидент',p:'Не чинить наугад. Порядок всегда один: подтвердить симптом → найти причину по логам и метрикам → исправить → проверить → записать.',code:'симптом      curl localhost\nсостояние    systemctl status nginx\nпричина      journalctl -u nginx, /var/log/nginx/error.log\nресурсы      df -h, du -sh /var/log/*\nисправление  systemctl restart nginx\nпроверка     curl localhost'},
     {h:'Диск',p:'Заполненный диск — одна из самых частых причин ночных падений: сервисы не могут писать логи, PID-файлы и временные данные.',terms:[['df -h','занятость разделов'],['du -sh папка/*','что именно занимает место'],['logrotate','ротация и сжатие старых логов по расписанию']]}],
 l5:[{h:'HTTP за одну карточку',p:'Клиент отправляет запрос (метод, путь, заголовки), сервер отвечает кодом статуса и телом. По первой цифре кода видно, чья проблема.',code:'2xx  успех             200 OK, 201 Created\n3xx  перенаправление   301, 302, 304\n4xx  ошибка клиента    400, 401, 403, 404, 429\n5xx  ошибка сервера    500, 502, 503, 504'},
     {h:'Порты',p:'IP-адрес — это дом, порт — квартира. Один сервер слушает много портов, у каждого сервиса свой.',code:'22    SSH\n80    HTTP\n443   HTTPS\n5432  PostgreSQL\n6379  Redis\n9090  Prometheus',terms:[['502','прокси не получил нормального ответа от бэкенда'],['503','сервис недоступен (часто — нет живых подов)'],['504','бэкенд не успел ответить']]}],
 l6:[{h:'Зачем контейнеры',p:'«У меня работает» — классическая проблема: на сервере другая версия языка, библиотек или ОС. Контейнер упаковывает приложение вместе со всем окружением, и оно запускается одинаково везде.',code:'образ (image)  ──docker run──►  контейнер\nшаблон, только чтение          запущенный процесс\nnginx:1.27                     web (порт 8080 → 80)'},
     {h:'Основные команды',code:'docker run -d --name web -p 8080:80 nginx:1.27\n           │  │          │          └ образ:тег\n           │  │          └ порт сервера:порт контейнера\n           │  └ имя\n           └ в фоне\ndocker ps          # запущенные\ndocker logs web    # логи\ndocker stop web    # остановить',terms:[['image','шаблон: приложение и зависимости'],['container','запущенный экземпляр образа'],['registry','хранилище образов: Docker Hub, GitHub, Yandex Container Registry']]}],
 l7:[{h:'Почему контейнеры падают',p:'Контейнер живёт, пока жив его главный процесс. Процесс упал — контейнер остановился с кодом выхода. Причина почти всегда видна в docker logs.',code:'docker ps -a\nSTATUS\nUp 3 minutes    работает\nExited (0)      завершился штатно\nExited (1)      ошибка в приложении\nExited (137)    убит (часто — нехватка памяти)'},
     {h:'Конфигурация через окружение',p:'Один и тот же образ работает в dev и prod — отличаются только переменные окружения: адрес базы, уровень логов, ключи. Их передают при запуске, а не зашивают в образ.',code:'docker run -d --name api \\\n  -e DATABASE_URL=postgres://db:5432/app \\\n  -e LOG_LEVEL=info \\\n  api:1.0',terms:[['-e КЛЮЧ=ЗНАЧЕНИЕ','переменная окружения'],['--env-file .env','все переменные из файла'],['docker rm','удалить остановленный контейнер']]}],
 l8:[{h:'Зачем Kubernetes',p:'Когда контейнеров десятки, а серверов несколько, кто-то должен решать, где их запускать, перезапускать упавшие и обновлять без простоя. Это делает Kubernetes.',code:'Ты описываешь ЖЕЛАЕМОЕ:          Kubernetes доводит РЕАЛЬНОЕ:\n  deployment web: 3 реплики   →    под упал → создать новый\n  образ web:1.4                    нода умерла → переселить поды'},
     {h:'Основные объекты',code:'Deployment ──управляет──► ReplicaSet ──► Pod  Pod  Pod\n(желаемое состояние,        (нужное        (контейнеры)\n обновления, откаты)         число копий)',terms:[['Pod','один или несколько контейнеров с общим IP'],['Deployment','держит нужное число подов и обновляет их'],['kubectl','CLI для Kubernetes: get, describe, logs, delete, apply'],['namespace','папка для ресурсов: prod, stage, monitoring']]}],
 l9:[{h:'Статусы подов',p:'Статус пода — первая подсказка, где искать причину.',code:'Pending                      ждёт ноду с ресурсами\nContainerCreating            качает образ, запускается\nRunning                      работает\nCrashLoopBackOff             падает при старте, перезапуск с паузой\nImagePullBackOff             не может скачать образ\nCreateContainerConfigError   нет нужного ConfigMap или Secret\nOOMKilled                    превысил лимит памяти'},
     {h:'Откат — первым делом',p:'Если релиз сломал прод, сначала верни рабочую версию, потом разбирайся. Kubernetes хранит историю ревизий деплоймента.',code:'kubectl rollout history deployment/api\nkubectl rollout undo deployment/api\nkubectl rollout status deployment/api',terms:[['logs --previous','логи прошлого, упавшего запуска контейнера'],['get events','события кластера: перезапуски, ошибки планировщика'],['rollout undo','откат на предыдущую ревизию']]}],
 l10:[{h:'Горизонтальное масштабирование',p:'Нагрузка выросла — добавь копий. Kubernetes распределит трафик между подами через Service. Это проще и надёжнее, чем раздувать один сервер.',code:'kubectl top pods                           # кто сколько ест\nkubectl scale deployment/web --replicas=5  # руками\n\nHPA: держать CPU около 70%, от 2 до 10 подов  # автоматически'},

function splitTop(line,sep){const out=[];let cur='',q=null;for(let i=0;i<line.length;i++){const ch=line[i];

function pipeFilter(W,text,cmdline){

  if(/^(cat|cd|ls|tail|head|rm|grep|chmod|chown|bash|less|wc|sudo)$/.test(parts[0]||'')||parts.includes('-f')||last.startsWith('./')||last.includes('/')){const base=last.includes('/')?last.slice(0,last.lastIndexOf('/')+1):'';const d=rp(W,base||'.');children(W,d).forEach(c=>words.push(base+c.n+(c.dir?'/':'')))}

const WORKER_SRC=`let fn=null,state={};
function mk(d,calls,logs){const sv=d.services;return{time:d.time||'20:00',minute:d.minute||0,rps:d.rps||300,success:d.success==null?1:d.success,credits:d.credits||100,budget:d.budget||100,services:sv,service:n=>sv.find(s=>s.name===n)||null,scale:(n,r)=>{calls.push({t:'scale',n,r:Math.round(+r)})},restart:p=>{calls.push({t:'restart',p:String(p)})}}}
onmessage=e=>{const m=e.data;
 if(m.type==='test'){let f;try{f=new Function('cluster','log','state','"use strict";\\n'+m.code)}catch(err){postMessage({type:'test',err:'SyntaxError: '+err.message});return}
  postMessage({type:'test',res:m.cases.map(d=>{const calls=[],logs=[];try{f(mk(d,calls,logs),x=>logs.push(String(x)),{});return{calls,logs}}catch(err){return{calls,logs,err:err.message}}})});return}
 if(m.type==='load'){try{fn=new Function('cluster','log','state','"use strict";\\n'+m.code);state={};postMessage({type:'loaded'})}catch(err){postMessage({type:'loaded',err:'SyntaxError: '+err.message})}return}
 if(m.type==='tick'&&fn){const calls=[],logs=[];try{fn(mk(m.snap,calls,logs),x=>logs.push(typeof x==='string'?x:JSON.stringify(x)),state);postMessage({type:'tick',calls,logs})}catch(err){postMessage({type:'tick',calls,logs,err:err.message})}}};`;
const WORKER_URL=URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'}));
function runTests(code,cases){return new Promise(res=>{const w=new Worker(WORKER_URL);const to=setTimeout(()=>{w.terminate();res({err:'Скрипт выполняется слишком долго. Похоже на бесконечный цикл.'})},1500);
  w.onmessage=e=>{clearTimeout(to);w.terminate();res(e.data)};w.onerror=e=>{clearTimeout(to);w.terminate();res({err:e.message||'Ошибка скрипта'})};w.postMessage({type:'test',code,cases:cases.map(c=>c.data)})})}

  if(v==='top')return[[pad('NAME',14)+pad('CPU',7)+'MEM'].concat(Object.values(G.svc).flatMap(s=>s.pods.filter(p=>p.status==='Running').map(p=>pad(p.name,14)+pad(Math.min(100,Math.round(s.util*100))+'%',7)+Math.round(p.mem)+'%'))).join('\n')];
  const pn=/^po/.test(res)?a[3]:a[2];
  if(v==='logs'){const[s,p]=bFind(pn);if(!p)return[`pods "${pn||''}" not found`,'e'];if(p.fault)return[`panic: env ${s.name==='auth'?'JWT_SIGNING_KEY':'DATABASE_URL'} is empty`,'e'];if(p.oom&&p.age<15)return['WARN heap 97%\n(previous container: OOMKilled, exit 137)','e'];return[`GET /healthz 200 2ms\nheap usage ${Math.round(p.mem)}%`]}
  if(v==='describe'){const[s,p]=bFind(pn);if(!p)return[`pods "${pn||''}" not found`,'e'];return[`Name: ${p.name}\nStatus: ${p.status}\nRestarts: ${p.restarts}\nMemory: ${Math.round(p.mem)}% of limit\nEvents: ${p.fault?'BackOff restarting failed container':p.oom?'OOMKilling':'Started'}`]}
  if(v==='delete'){const e=bDel(pn,'t');return e?[e,'e']:[`pod "${pn}" deleted`,'g']}
  if(v==='scale'){let t=a[2]||'';if(t.includes('/'))t=t.split('/')[1];else if(/^deploy/.test(t))t=a[3]||'';const m=line.match(/--replicas[=\s]+(\d+)/);if(!m)return['укажи --replicas=N','e'];const e=bScale(t,+m[1],'t');return e?[e,'e']:[`deployment.apps/${t} scaled`,'g']}
  return['Доступно: get pods, get deploy, top pods, logs, describe, delete pod, scale','e']}
function bRender(){
  $('#bClock').textContent=bClockStr();const pct=Math.min(100,G.t/DUR*100);$('#bGoal').style.width=pct+'%';$('#bGoalTxt').textContent=Math.round(pct)+'%';
  $('#bRps').textContent=G.rps+' rps';const sp=G.success*100;$('#bSucc').textContent=(sp>=99.95?'100':sp.toFixed(1))+'%';$('#bSucc').style.color=G.success<.99?'var(--bad)':'';
  $('#bLat').textContent=G.lat+' ms';$('#bBud').textContent=Math.max(0,G.budget).toFixed(0)+'%';$('#bBud').style.color=G.budget<40?'var(--bad)':'';$('#bCred').textContent=G.credits.toFixed(0);$('#bCred').style.color=G.credits<30?'var(--bad)':'';
  $('#bPager').hidden=!G.paging;if(G.paging){const w=Object.values(G.svc).sort((a,b)=>b.util-a.util)[0];$('#bPagerTxt').textContent=`PAGER · успешность ${sp.toFixed(1)}% · горячее всего: ${w.name} (util ${Math.round(Math.min(w.util,9.99)*100)}%)`}
  const box=$('#bSvcs');for(const s of Object.values(G.svc)){let el=box.querySelector(`[data-s="${s.name}"]`);
    if(!el){el=document.createElement('div');el.className='svc';el.dataset.s=s.name;el.innerHTML=`<header><h4>${s.name}</h4><small>${CFG[s.name].desc}</small><span></span></header><div class="util">util<div class="ub"><div></div></div><b></b></div><div class="pods"></div>`;box.append(el)}
    const run=s.pods.filter(p=>p.status==='Running').length;el.querySelector('header span').textContent=`${run}/${s.replicas}`+(s.name==='worker'?` · очередь ${Math.round(s.queue)}`:'');
    el.classList.toggle('hot',s.util>1||!run);const ub=el.querySelector('.ub div');ub.style.width=Math.min(100,s.util*100)+'%';ub.style.background=s.util>1?'var(--bad)':s.util>.8?'var(--flame)':'var(--ok)';
    el.querySelector('.util b').textContent=(s.util>=9.9?'∞':Math.round(s.util*100))+'%';
    const pb=el.querySelector('.pods');pb.innerHTML='';for(const p of s.pods){const b=document.createElement('button');b.className='pod '+p.status;b.title=`${p.name} · ${p.status} · mem ${Math.round(p.mem)}%`;b.setAttribute('aria-label',b.title);b.innerHTML=`<span style="height:${Math.min(100,p.mem)}%"></span>`;
      b.onclick=()=>{document.querySelector('[data-bt="term"]').click();$('#bIn').value=`kubectl logs ${p.name}`;$('#bIn').focus()};pb.append(b)}}
}
